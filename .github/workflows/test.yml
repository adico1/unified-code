name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  physical_evidence:
    name: Complete physical evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e .

      - name: Run every slow physical proof
        env:
          UC_VERIFY_MATERIALIZE: "1"
        run: uc verify-all

      - name: Upload exact physical proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: physical-proof-bundle
          path: seed/verification/PROOF_BUNDLE.json
          if-no-files-found: error

  functional:
    name: Functional suite (Python ${{ matrix.python-version }})
    needs: physical_evidence
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            verification-command: uc verify-all
            evidence-command: python scripts/assert_verify_budget.py
          - python-version: "3.12"
            verification-command: uc verify-all
            evidence-command: python scripts/assert_verify_budget.py
          - python-version: "3.13"
            verification-command: uc verify-all
            evidence-command: python scripts/assert_verify_budget.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Acquire exact physical proof bundle
        uses: actions/download-artifact@v4
        with:
          name: physical-proof-bundle
          path: seed/verification

      - name: Run functional tests
        run: ${{ matrix.verification-command }}

      - name: Enforce verify-all timing and evidence contract
        run: ${{ matrix.evidence-command }}

      # CI verifies benchmark *logic* via deterministic unit tests above.
      # Cloud-runner wall-clock time is NOT the authority for L9.
      # Authoritative L9 measurement: local `uc benchmark --iterations 20`.

  calculator_windows:
    name: Calculator Windows x64 projection
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Generate calculator suite
        run: >-
          python -m unified.generator.cli calculator generate-suite seed/calculator_suite.json
          --output "${{ runner.temp }}/unified-calculator-suite"
          --build --install --verify --gauntlet-depths 10

      - name: Execute Windows x64 projection
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}/unified-calculator-suite/bounded-integer-expression-calculator"
          $actual = python "$root/targets/windows-x64/run.py" '{"expression":"2 + 3 * 4"}'
          $result = $actual | ConvertFrom-Json
          if ($result.value.result -ne 14) { throw "Windows projection mismatch" }
          if (($result.evidence -join ",") -ne "input:normalized,uem:executed,result:formed") { throw "Windows evidence mismatch" }

  l13:
    name: L13 Complete Testing Gauntlet
    needs: physical_evidence
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Acquire exact physical proof bundle
        uses: actions/download-artifact@v4
        with:
          name: physical-proof-bundle
          path: seed/verification

      - name: Validate content-addressed L1-L13 evidence lazily
        run: uc verify-all

      - name: Enforce five-second and complete-proof contract
        run: python scripts/assert_verify_budget.py

  standard_ten:
    name: Standard Ten (governing contract)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: STANDARD_TEN.md present
        run: test -f STANDARD_TEN.md && test -f seed/ROOT.seed.json

      - name: standard.gap is only fallback refusal
        run: |
          python - <<'PY'
          from unified.standard import standard_gap, refuse_conventional
          g = standard_gap({"value": {"gap_id": "gap.ci", "rule": "3", "summary": "ci"}, "depths": (), "axes": (), "evidence": (), "state": "formed"})
          assert g["state"] == "invalid" and "standard.gap" in g["evidence"]
          r = refuse_conventional({"value": {"summary": "oop"}, "depths": (), "axes": (), "evidence": (), "state": "formed"})
          assert r["state"] == "invalid"
          print("standard.gap OK")
          PY

      - name: Generate UEM from seed declarations
        run: |
          python - <<'PY'
          from unified.standard_generate import generate_all_seed_declarations
          r = generate_all_seed_declarations()
          assert r.get("state") == "formed", r
          print(r["value"]["generated"])
          PY

      - name: Provenance audit
        run: python scripts/audit_standard_ten.py audit

      - name: Clean-room partial (UEM artifacts)
        run: |
          chmod +x scripts/clean_room_ten.sh
          ROOT="$PWD" bash scripts/clean_room_ten.sh

      - name: Reject conventional claim of TEN completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("PROVENANCE_MANIFEST.json").read_text(encoding="utf-8"))
          # While gaps open, verdict must not be silently pass
          open_gaps = m.get("open_gaps") or []
          illegal = m.get("illegal_provenance_count") or 0
          if open_gaps or illegal:
              assert m.get("verdict") == "fail", m.get("verdict")
              print("honest fail while migration open:", len(open_gaps), "gaps,", illegal, "illegal files")
          else:
              # Only when fully migrated
              assert m.get("verdict") == "pass"
              print("TEN complete")
          PY

      - name: Enforcement must not greenwash gaps
        run: |
          set +e
          python scripts/audit_standard_ten.py enforce
          code=$?
          set -e
          python - <<PY
          import json
          from pathlib import Path
          m = json.loads(Path("PROVENANCE_MANIFEST.json").read_text(encoding="utf-8"))
          open_gaps = m.get("open_gaps") or []
          illegal = int(m.get("illegal_provenance_count") or 0)
          code = $code
          if open_gaps or illegal:
              assert code != 0, (code, "enforce must fail while gaps/illegal provenance exist")
              print("enforce non-zero OK under open migration")
          else:
              assert code == 0, code
              print("enforce pass — TEN complete")
          PY
