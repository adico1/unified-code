name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functional:
    name: Functional suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run functional tests
        run: pytest

      # CI verifies benchmark *logic* via deterministic unit tests above.
      # Cloud-runner wall-clock time is NOT the authority for L9.
      # Authoritative L9 measurement: local `uc benchmark --iterations 20`.
