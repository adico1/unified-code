[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-code"
version = "0.1.0"
description = "Experimental single-signature recursive software construction grammar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adi Ovadia Cohen" }]

[project.scripts]
uc = "unified.generator.cli:host_main"

[tool.setuptools.packages.find]
include = ["unified*"]
